name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: quality-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  probe-staging:
    # Local Docker services in the CI runner only. No push/deploy/tunnel/plugin setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mcp:staging:prepare
      - name: Configure synthetic container-only test inputs
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = '.local/mcp-staging/.env';
          writeFileSync(file, readFileSync(file, 'utf8').replace('REPLACE_WITH_SYNTHETIC_OAUTH_SUBJECT', 'synthetic-ci-subject').replace('REPLACE_WITH_REVIEWED_COMMIT_SHA', process.env.GITHUB_SHA), { mode: 0o600 });
          NODE
      - name: Validate and build reviewed MCP container
        run: |
          docker compose --env-file .local/mcp-staging/.env -f staging/probe/compose.yaml config --quiet
          docker compose --env-file .local/mcp-staging/.env -f staging/probe/compose.yaml build init
      - name: Initialize fresh isolated PostgreSQL and private gateway
        run: |
          docker compose --env-file .local/mcp-staging/.env -f staging/probe/compose.yaml up -d --wait db
          docker compose --env-file .local/mcp-staging/.env -f staging/probe/compose.yaml run --rm init > .local/mcp-staging/sandbox.json
          pnpm mcp:staging:prepare --sandbox
          docker compose --env-file .local/mcp-staging/.env -f staging/probe/compose.yaml --profile private up -d mcp private-gateway
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3310/.well-known/oauth-protected-resource/mcp > /dev/null; then break; fi
            sleep 1
          done
      - name: Check canonical discovery and unauthenticated rejection through real gateway
        run: DOTENV_CONFIG_PATH=.local/mcp-staging/.env pnpm mcp:staging:smoke
      - name: Remove ephemeral runner services
        if: always()
        run: docker compose --env-file .local/mcp-staging/.env -f staging/probe/compose.yaml --profile private down --volumes
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eruty
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: eruty_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eruty:ci-only-synthetic-password@127.0.0.1:5432/eruty_test
      APP_ORIGIN: http://127.0.0.1:3000
      BOOTSTRAP_EMAIL: operator@example.invalid
      BOOTSTRAP_PASSWORD: ci-only-synthetic-operator-password
      E2E_ALLOW_WRITES: "true"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: eruty-private-ci
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ephemeral-ci-storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral storage credential
        run: node -e "const key = require('crypto').randomBytes(32).toString('hex'); console.log('::add-mask::' + key); require('fs').appendFileSync(process.env.GITHUB_ENV, 'S3_SECRET_ACCESS_KEY=' + key + '\n')"
      - run: pnpm storage:install
      - name: Start authenticated loopback S3 service
        run: |
          mkdir -p .local
          pnpm storage:local > .local/storage-process.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9000; then break; fi
            sleep 1
          done
          pnpm storage:init
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm mcp:build
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: pnpm test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-browser-screenshots
          path: test-results/assets-*.png
          if-no-files-found: ignore
