name: Quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eruty
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: eruty_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eruty:ci-only-synthetic-password@127.0.0.1:5432/eruty_test
      APP_ORIGIN: http://127.0.0.1:3000
      BOOTSTRAP_EMAIL: operator@example.invalid
      BOOTSTRAP_PASSWORD: ci-only-synthetic-operator-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
