name: eruty-discovery-local
services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: discovery_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: eruty_discovery_local
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports: [127.0.0.1:55434:5432]
    volumes: [discovery-data:/var/lib/postgresql]
    # Docker Desktop does not publish ports for an internal-only network.
    # The separate administration bridge enables loopback-only owner/verifier
    # access; no DB port is bound to a LAN/public interface.
    networks: [database, administration]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U discovery_owner -d eruty_discovery_local]
      interval: 3s
      timeout: 3s
      retries: 20
  mcp:
    image: eruty-discovery-local:${MCP_BUILD_SHA:?}
    build:
      context: ../..
      dockerfile: staging/probe/Dockerfile
      args: {VCS_REF: "${MCP_BUILD_SHA:?}"}
    environment:
      NODE_ENV: production
      MCP_SERVER_MODE: discovery
      DATABASE_URL: postgresql://eruty_discovery_runtime:${MCP_RUNTIME_PASSWORD:?}@db:5432/eruty_discovery_local
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:?}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:?}
      MCP_OAUTH_JWKS_URL: ${MCP_OAUTH_JWKS_URL:?}
      MCP_BUILD_SHA: ${MCP_BUILD_SHA:?}
      MCP_DISCOVERY_ORGANIZATION_ID: ${MCP_DISCOVERY_ORGANIZATION_ID:?}
      MCP_ALLOWED_ORIGINS: https://chatgpt.com
      MCP_BIND_HOST: 0.0.0.0
      MCP_ALLOW_REMOTE_BIND: "true"
      MCP_PORT: "3100"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [database, outbound]
    depends_on: {db: {condition: service_healthy}}
  private-gateway:
    image: caddy:2-alpine
    environment: {MCP_RESOURCE_HOST: "${MCP_RESOURCE_HOST:?}"}
    volumes: [../probe/Caddyfile.private:/etc/caddy/Caddyfile:ro]
    ports: [127.0.0.1:3311:8080]
    networks: [outbound]
    depends_on: [mcp]
networks:
  database: {internal: true}
  administration: {}
  outbound: {}
volumes:
  discovery-data: {}
